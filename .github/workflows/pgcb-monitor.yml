name: PGCB Competitive Intelligence Monitor

on:
  workflow_dispatch:

  schedule:
    # 9:05 AM Eastern Daylight Time (13:05 UTC)
    - cron: "5 13 * * 1-5"

    # 5:05 PM Eastern Daylight Time (21:05 UTC)
    - cron: "5 21 * * 1-5"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python main.py
      - name: Run monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python main.py
